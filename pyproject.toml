[project]
name = "mgn-anomaly"
version = "0.1.0"
description = "MeshGraphNet surrogate as a physics-aware anomaly detector on deforming_plate, with CLIP baselines and VLM explanations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy",
    "scipy",
    "scikit-learn",
    "protobuf",
    "requests",
    "pyvista",
    "open_clip_torch",
    "mlx-vlm",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgn"]
